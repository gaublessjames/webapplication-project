version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: cafe_fausse_3
      POSTGRES_USER: cafe_fausse_user
      POSTGRES_PASSWORD: cafe_fausse_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    command: >
      sh -c "
        python setup_database_robust.py &&
        gunicorn -w 4 -b 0.0.0.0:5000 run:app
      "
    environment:
      FLASK_ENV: development
      SECRET_KEY: cafe-fausse-secret-key-2024-dev
      DEBUG: "True"
      DATABASE_URL: postgresql://cafe_fausse_user:cafe_fausse_pass@db:5432/cafe_fausse_3
    depends_on:
      - db
    ports:
      - "5001:5000"
    volumes:
      - ./back-end:/app

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    environment:
      VITE_LOCAL_API_URL: http://localhost:5001/api
      NODE_ENV: development
      DOCKER_ENV: "true"
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./front-end:/app
      - /app/node_modules # Ensures container uses its own node_modules
    stdin_open: true
    tty: true

  # Production frontend service (uncomment to use)
  # frontend-prod:
  #   build:
  #     context: ./front-end
  #     dockerfile: Dockerfile.prod
  #   environment:
  #     VITE_LOCAL_API_URL: http://localhost:5001/api
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend

volumes:
  postgres_data: 